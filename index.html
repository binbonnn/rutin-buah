<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Weekly Routine & Fruit Planner — pengelola rutinitas mingguan, progres skripsi, konsumsi buah, stok, dan anggaran belanja dalam satu aplikasi." />
  <meta name="theme-color" content="#cbd2dc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Rutin & Buah" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Rutin & Buah — Weekly Planner</title>
</head>
<body>
  <!-- Architectural studio sunlight + soft pastel refraction -->
  <div class="bg-mesh" aria-hidden="true">
    <span class="studio-bloom lavender"></span>
    <span class="studio-bloom mint"></span>
    <span class="studio-bloom peach"></span>
  </div>
  <div class="mobile-backdrop" id="mobile-backdrop" aria-hidden="true"></div>
  <a class="skip-link" href="#app">Lewati ke konten</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div>
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none">
              <circle cx="10.5" cy="10.5" r="4.5" fill="#F68A73" />
              <circle cx="17.5" cy="10.5" r="4.5" fill="#FBBF24" />
              <circle cx="10.5" cy="17.5" r="4.5" fill="#8B5CF6" />
              <circle cx="17.5" cy="17.5" r="4.5" fill="#34D399" />
              <circle cx="14" cy="14" r="2.2" fill="#FFFFFF" />
            </svg>
          </div>
          <div class="brand-text">
            <strong>Rutin &amp; Buah</strong>
            <span>Weekly planner</span>
          </div>
          <button class="btn-icon brand-close" id="menu-close" type="button" aria-label="Tutup menu" title="Tutup menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>

        <nav class="nav" id="nav" aria-label="Menu Utama"></nav>
      </div>

      <div class="sidebar-foot">
        <div class="sidebar-streak">
          <span class="streak-dot" aria-hidden="true"></span>
          <div>
            <strong id="sidebar-progress">0%</strong>
            <span id="sidebar-progress-label">0% pekan ini</span>
          </div>
        </div>
        <div class="orb-row">
          <button class="orb coral" id="sidebar-orb" type="button" data-goto="dashboard" title="Progres pekan ini"><span id="sidebar-progress-orb">0%</span><span class="sr-only"> progres pekan ini</span></button>
          <button class="orb violet" type="button" data-goto="skripsi" title="Target skripsi" aria-label="Buka target skripsi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7" /></svg>
          </button>
          <button class="btn-icon" id="theme-toggle" type="button" aria-label="Ganti tema" title="Ganti tema terang/gelap"></button>
        </div>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <div class="topbar-inner">
          <button class="btn-icon menu-toggle" id="menu-toggle" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="sidebar" title="Buka menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <div class="topbar-title">
            <span class="eyebrow" id="topbar-date">—</span>
            <h1 id="page-title">Beranda</h1>
          </div>
          <div class="topbar-actions">
            <button class="btn-icon mobile-theme" id="mobile-theme-toggle" type="button" aria-label="Ganti tema" title="Ganti tema"></button>
            <button class="btn-icon" id="install-btn" type="button" hidden aria-label="Pasang aplikasi" title="Pasang aplikasi"></button>
            <button class="btn btn-primary btn-sm" id="quick-fruit" type="button" title="Catat konsumsi buah"></button>
          </div>
        </div>
      </header>

      <div id="app" class="page" tabindex="-1"></div>

      <footer class="app-footer">
        <span>Data tersimpan di perangkat ini.</span>
        <button class="link-btn" id="footer-backup" type="button">Cadangkan data</button>
      </footer>
    </main>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <form id="modal-form" method="dialog" novalidate>
      <div class="modal-head">
        <h2 id="modal-title">Judul</h2>
        <button class="btn-icon" id="modal-close" type="button" aria-label="Tutup"></button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="modal-cancel" type="button">Batal</button>
        <button class="btn btn-primary" id="modal-submit" type="submit"><span id="modal-label">Simpan</span></button>
      </div>
    </form>
  </dialog>

  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
