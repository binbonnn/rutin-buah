name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Periksa sintaks JavaScript
        run: |
          for f in js/*.js scripts/*.js sw.js; do
            node --check "$f"
          done

      - name: Validasi JSON/manifest dan versi
        run: |
          node -e "
            const fs = require('node:fs');
            for (const f of ['package.json', 'package-lock.json', 'manifest.webmanifest']) {
              JSON.parse(fs.readFileSync(f, 'utf8'));
              console.log(f + ': valid');
            }
            const pkg = require('./package.json');
            const lock = require('./package-lock.json');
            if (pkg.version !== lock.version) throw Error(pkg.version + ' != ' + lock.version);
            console.log('versi package/lock: ' + pkg.version);
          "

      - name: Pasang dependency pengujian
        run: npm ci

      - name: Jalankan ESLint
        run: npm run lint

      - name: Jalankan tes regresi
        run: npm test

      - name: Pasang browser Playwright
        run: npx playwright install --with-deps chromium

      - name: Jalankan tes E2E
        run: npm run test:e2e

      - name: Unggah laporan E2E saat gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
